<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview image source: The Horological Archive</title>
<!-- Source for og-image.png (1200 x 630). Re-render with headless Chrome from this folder:
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 --screenshot=og-image.png og-image-source.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0 !important; width: 1200px; height: 630px; overflow: hidden; }
  /* the homepage's navy and brass, with the Nature of Time's night sky behind */
  body { --paper: #14283f; --ink: #efe6d2; --ink-2: #cfc6b1; --tint: #1f3a59; --tint-2: #2c4f77; --sienna: #b8975a; --rule: #33486a;
    background: radial-gradient(ellipse 70% 90% at 78% 46%, #1a3350, #14283f 55%, #0c1626 100%); color: #efe6d2; }
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; fill: #efe6d2; }
  .card-og { position: absolute; inset: 22px; border: 1.5px solid #b8975a; outline: 1px solid rgba(184, 151, 90, .4); outline-offset: 7px; display: grid; grid-template-columns: 610px 1fr; }
  .words { padding: 56px 0 0 54px; display: flex; flex-direction: column; }
  .words .eb { font-family: var(--mono); font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: #b8975a; }
  .words h1 { margin: 22px 0 0; font-family: var(--serif); font-weight: 500; font-size: 70px; line-height: 1.0; letter-spacing: -.01em; color: #efe6d2; }
  .words p { margin: 26px 0 0; font-family: var(--serif); font-style: italic; font-size: 36px; line-height: 1.1; color: #b8975a; }
  .words .ft { margin-top: auto; padding-bottom: 42px; font-family: var(--mono); font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: #cfc6b1; white-space: nowrap; }
  .words .ft span { color: #b8975a; margin: 0 8px; }
  .bench { position: relative; display: flex; align-items: center; justify-content: center; padding-right: 26px; }
  .bench .mid { width: 372px; flex: none; }
  .bench .fig { overflow: visible; height: auto; width: 100%; }
</style>
</head>
<body>
<svg class="stars" id="stars" aria-hidden="true"></svg>
<div class="card-og">
  <div class="words">
    <div class="eb">The Horological Archive</div>
    <h1>The art, engineering and history of timekeeping.</h1>
    <p>Look closer. Understand more.</p>
    <div class="ft">Workbench<span>·</span>Archive<span>·</span>Examination<span>·</span>History<span>·</span>Nature of Time</div>
  </div>
  <div class="bench">
    <div class="mid" data-w="speedy105003"></div>
  </div>
</div>
<script src="data.js"></script>
<script src="draw.js"></script>
<script>
  document.querySelectorAll('[data-w]').forEach(el => { el.innerHTML = Draw.front(WATCHES.find(w => w.id === el.dataset.w), {}); });
  // Hands fixed at 10:08:36 so the image is the same every time it is rendered.
  const A = { h: 304.3, m: 51.6, s: 216 };
  document.querySelectorAll('[data-hand]').forEach(el => el.setAttribute('transform', `rotate(${A[el.dataset.hand]})`));
  // The same still field of stars as the Nature of Time page: seeded, so every render matches.
  let x = 20261, c = ''; const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 170; i++) { const r = rnd(); c += `<circle cx="${(rnd() * 100).toFixed(2)}%" cy="${(rnd() * 100).toFixed(2)}%" r="${r > 0.95 ? 1.6 : r > 0.7 ? 1.1 : 0.7}" opacity="${(0.18 + rnd() * 0.5).toFixed(2)}"/>`; }
  document.getElementById('stars').innerHTML = c;
</script>
</body>
</html>
